name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint + tests (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # sounddevice necesita PortAudio y opencv-python necesita libGL aunque
      # los tests no usen micrófono ni cámara (se importan a nivel de módulo).
      # `import sounddevice` inicializa PortAudio, que falla si no hay servidor
      # de audio: se levanta un PulseAudio con un sink nulo (sin dispositivos).
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libgl1 libglib2.0-0 pulseaudio

      - name: Dummy audio server
        run: |
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dummy

      - name: Install Poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      # Umbral por debajo del score actual (8.63 tras ADR-0015; la nota bajó por
      # borrar código limpio, sin avisos nuevos): bloquea regresiones sin
      # exigir limpiar todo el backlog de pylint de una vez.
      - name: Lint
        run: poetry run pylint src/ --fail-under=8.5

      - name: Tests
        run: poetry run pytest -q

  web:
    name: Tests + build (dashboard web)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      # typecheck (tsc --noEmit) + build de producción
      - name: Build
        run: npm run build
